schema: prueba.gen2.v1
id: IMG-01
titulo: "Percepción sobre bench_v3: gdino-tiny-560 (campeón)"
informe: ["Tabla 51"]
fase: F4
familia: imagenes
pregunta: >
  ¿Qué AP50 por clase y qué mAP50 logra el campeón sobre las 6.477 imágenes de bench_v3, por
  estrato y agregado?
gen1:
  result_id: confirmacion_b5 (doc 64 y 66)
  doc: operacion/66
  corridas: {obra_test: run_20260723_023517_dbe_grounding_dino_07105b, obra_val: run_20260723_023532_dbe_grounding_dino_8d528e,
             shel5k: run_20260723_035251_dbe_grounding_dino_0225e1, chv: run_20260723_041205_dbe_grounding_dino_f91bed}
  referencia:
    fuente: >
      las corridas de la generación 1 re-evaluadas el 2026-10-26 con este mismo código
      (run_evaluation del media-plane + bench_v3_report): reproduce el mAP50 publicado (0,551)
    valores:
      mAP50: 0.550535
      ap50_person: 0.783893
      ap50_helmet: 0.735144
      ap50_vest: 0.551475
      ap50_bare_head: 0.13163
      obra_test.person: 0.6951
      obra_test.helmet: 0.7198
      obra_test.vest: 0.465
      obra_test.bare_head: 0.0285
      obra_test.cr01_recall: 0.28
      obra_val.person: 0.7157
      obra_val.helmet: 0.7892
      obra_val.vest: 0.5609
      obra_val.bare_head: 0.0212
      obra_val.cr01_recall: 0.4857
      chv.person: 0.8618
      chv.helmet: 0.8864
      chv.vest: 0.5531
      shel5k.person: 0.7698
      shel5k.helmet: 0.7072
      shel5k.bare_head: 0.1327
      shel5k.cr01_recall: 0.3081
esperado: >
  Idéntico estrato por estrato (misma GPU, fp16). El recall CR-01 AGREGADO no se compara: el
  publicado (0,308, n = 5.313) mezcló valores de `bench_obra` verificados a mano con el GT del
  23-jul; acá se pondera con el GT vigente (5.308 violadores) y se reporta con su n.
veredictos_posibles: [identico, equivalente_con_diferencia, otra_combinacion]
config:
  modelo: grounding-dino/gdino-tiny-560
  prompt_set: cr01_cr02_bench_v2 (person, helmet, vest, bare_head)
  evaluacion: COCO curado por estrato, GT restringido a las imágenes procesadas, IoU 0,5
receta:
  instancia: mp-gdino-tiny-560
  modelo: grounding-dino/gdino-tiny-560
  prompts:
    set_id: cr01_cr02_bench_v2
    fuente: prompts/cr01_cr02_bench_v2.yaml
    clases: [person, helmet, vest, bare_head]
    frozen: {prompts/cr01_cr02_bench_v2.yaml: 9775f75b66aea610882075047a640bbc51176373864a0793fdb15e036b5437e8}
  clases: [person, helmet, vest, bare_head]
  estratos:
    - {id: obra_test, imagenes: datasets/raw/construction_site_safety/test/images,
       coco: datasets/processed/coco/bench/curated/construction_site_safety_bench_obra_test.json,
       person_gt: datasets/processed/coco/bench/curated/person_gt_bench_obra.json}
    - {id: obra_val, imagenes: datasets/raw/construction_site_safety/valid/images,
       coco: datasets/processed/coco/bench/curated/construction_site_safety_bench_obra_val.json,
       person_gt: datasets/processed/coco/bench/curated/person_gt_bench_obra.json}
    # CHV no tiene person_gt propio: el recall CR-01 sale None, como en la generación 1.
    - {id: chv, imagenes: datasets/raw/chv/CHV_dataset/images,
       coco: datasets/processed/coco/bench/curated/bench_stratum_chv.json,
       person_gt: datasets/processed/coco/bench/curated/person_gt_bench_obra.json}
    - {id: shel5k, imagenes: "datasets/raw/shel5k/9rcv8mm682-4/Safety Helmet Wearing Dataset/Images",
       coco: datasets/processed/coco/bench/curated/bench_stratum_shel5k.json,
       person_gt: datasets/processed/coco/bench/curated/person_gt_shel5k.json}
  timeout_s: 7200
salida: e-ovrt_experimental-setup/results/gen2/IMG-01/
