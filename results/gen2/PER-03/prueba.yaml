schema: prueba.gen2.v1
id: PER-03
titulo: "Estado por persona en video de obra real (17 clips)"
informe: ["Tabla 52 (video)", "§17.5.3"]
fase: F5
familia: nivel_a_video
depende_de: [ALR-07]
pregunta: >
  Por persona y por cuadro, en el punto de operación desplegado, ¿qué tan bien determina el
  sistema el estado de cada persona en video de obra real (13 clips del estrato B + 4 del piloto)?
gen1:
  result_id: na1_gdinotiny560_v2short_video
  doc: operacion/113
  referencia:
    archivo: results/bench_nivel_a/na1_gdinotiny560_v2short_video/metrics.json
