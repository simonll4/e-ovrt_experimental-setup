esperado: >
  Idéntico a la puntuación vigente (post revisión ciega, doc 113): CR-01 F1 0,031, CR-02 0,018.
  Los XML del estrato B salen del banco versionado (idénticos byte a byte a los del laboratorio
  que usó la generación 1, verificado el 2026-10-26).
veredictos_posibles: [identico, equivalente_con_diferencia, otra_combinacion]
config:
  modelo: grounding-dino/gdino-tiny-560
  prompt_set: cr01_cr02_v2_short
  puntaje: score_clip_person_state.py, 1 de cada 15 cuadros, punto de operación de cr01_cr02_v2
receta:
  reusa: ALR-07
  instancia: mp-gdino-tiny-560
  modelo: grounding-dino/gdino-tiny-560
  prompts:
    set_id: cr01_cr02_v2_short
    fuente: prompts/cr01_cr02_v2_short.yaml
    clases: [person, helmet, vest]
    frozen: {prompts/cr01_cr02_v2_short.yaml: df81fd48b6daf8924b5fb66aa1ce4acc0c880ac6ed8cd1245c6aca1babdb309a}
  banco:
    clips: [v01_c01, v01_c02, v02_c01, v03_c01, v03_c02, v04_c01, v04_c02, v04_c03, v05_c01, v06_c01, v07_c01, v09_c01, v10_c01]
    xml: datasets/processed/clip_bench/annotations
    info: datasets/processed/clip_bench/meta
