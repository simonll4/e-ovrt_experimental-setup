# Las filas de las Tablas 51 a 54 del informe, para comprobar que cada una está en alguna de las
# siete preguntas de la consola (preguntas.yaml; plan de la consola de evidencia, §9).
#
# Solo los nombres de las filas, sin cifras: las cifras se resuelven desde results/gen2. Son las
# filas de la v0.2 del informe (2026-10-01) más las que el mapa del informe suma al lado
# (docs: operacion/datos/146-cierre-plataforma-informe/mapa-informe.md). Cuando el informe cambie
# una tabla, se cambia esta lista y el test dice qué pregunta tiene que mostrar la fila nueva.

