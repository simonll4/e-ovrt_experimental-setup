      "r560.V": "Por una falta real, breve o fuera de episodio, a 560 px con caja 0,35"
      "r560.alertas_extra_por_fragmentacion": "De ellas, alertas de más por fragmentación de identidad, a 560 px con caja 0,35"
      "r800.falsas_alarmas": "Falsas alarmas por sujeto en los clips negativos (sin infracción), a 800 px con caja 0,35"
      "r800.P-no-detectado": "Por EPP no detectado, a 800 px con caja 0,35"
      "r800.P-intermitente": "Por EPP visto de a ratos, a 800 px con caja 0,35"
      "r800.F-sin-persona": "Sin persona en la referencia, a 800 px con caja 0,35"
      "r800.U": "Por un atributo que no se puede ver, a 800 px con caja 0,35"
      "r800.F-parcial": "Por una persona parcial, a 800 px con caja 0,35"
      "r800.P-disputado": "Por EPP disputado entre personas, a 800 px con caja 0,35"
      "r800.P-fuera-region": "Por EPP fuera de la región de evaluación, a 800 px con caja 0,35"
      "r800.V": "Por una falta real, breve o fuera de episodio, a 800 px con caja 0,35"
