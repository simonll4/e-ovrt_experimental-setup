# El vocabulario de cada prueba en la consola (plan de la consola de evidencia, §2.4, §3 y §4).
#
# Para cada prueba del catálogo: a qué pregunta pertenece (el catálogo de «Pruebas» se agrupa por las siete),
# qué midió en una oración y, cuando el nombre que el programa le dio a una cifra usa jerga de la campaña o
# de la implementación, su nombre llano. Lo que no está acá se muestra con el nombre del programa.
#
# Reglas que los tests hacen cumplir (webconsole/backend/tests/test_pruebas_vista.py): toda prueba del
# catálogo está acá con una pregunta que existe; «que_midio» no trae cifras escritas a mano; y ningún nombre
# que la consola muestra en una pantalla principal usa la jerga que el plan saca (§4).
#
# Los textos del registro previo y los firmados no se tocan: se citan tal cual en «Cómo se validó».

schema: consola.pruebas.v1

pruebas:
  ALR-01:
    pregunta: que-agrega
    que_midio: "Cuántos episodios del rodaje alerta el perfil operativo mirando la escena, y con cuántas falsas alarmas, contra la referencia corregida."
  ALR-02:
    pregunta: que-agrega
    que_midio: "Cuántos episodios del rodaje alerta el sistema con las mismas detecciones, pero siguiendo a cada persona en lugar de mirar la escena."
  ALR-03:
    pregunta: que-agrega
    que_midio: "Si el contraste base-560, más fuerte en cabeza descubierta y chaleco, alerta mejor que el perfil operativo con las mismas reglas."
  ALR-04:
    pregunta: que-agrega
    que_midio: "Qué logra de extremo a extremo describir la infracción entera en el texto, en lugar de deducirla por ausencia del EPP."
  ALR-05:
    pregunta: que-agrega
    que_midio: "Si sumar por disyunción las detecciones directas a las del núcleo mejora la alerta, sin inferencia nueva."
  ALR-06:
    pregunta: que-agrega
    que_midio: "Si usar la cabeza descubierta como evidencia directa mejora la alerta de sin casco con el contraste base-560."
  ALR-07:
    pregunta: obra-real
    que_midio: "Cuántas alertas acierta y cuántas falsas alarmas da el perfil operativo, mirando la escena, sobre clips de obra real sin guion."
  ALR-08:
    pregunta: obra-real
    que_midio: "Las falsas alarmas en obra real cuando el sistema sigue a cada persona, con las mismas detecciones."
  ALR-09:
    pregunta: obra-real
    que_midio: "Las falsas alarmas en obra real con el modelo del perfil operativo a mayor resolución de entrada y otro umbral de caja."
  ALR-10:
    pregunta: obra-real
    que_midio: "Las falsas alarmas en obra real con el perfil operativo y el mismo umbral de caja que la prueba a mayor resolución: aísla la resolución."
  ALR-11:
    pregunta: que-agrega
    que_midio: "Si YOLOE-26s, que en vivo, de cerca y con una persona, salió como el guion en todas sus tomas, sostiene la alerta sobre el rodaje guionado."
  ALR-12:
    pregunta: obra-real
    que_midio: "Cuántas falsas alarmas da YOLOE-26s en obra real, frente al perfil operativo."
  ALR-13:
    pregunta: que-agrega
    que_midio: "Qué gana y qué cuesta en el rodaje exigir más confianza para dar por presente el EPP, combinado y por partes."
  ALR-14:
    pregunta: obra-real
    que_midio: "Qué cuesta en obra real los patrones con umbrales de EPP más exigentes."
  DEN-01:
    pregunta: en-vivo
    que_midio: "Cuánto del resultado por escena sobrevive si el sistema procesa uno de cada siete cuadros."
  DEN-02:
    pregunta: en-vivo
    que_midio: "Si seguir a cada persona sigue sumando cuando el sistema procesa uno de cada siete cuadros."
  DEN-03:
    pregunta: en-vivo
    que_midio: "Cuánto del resultado por escena sobrevive si el sistema procesa uno de cada quince cuadros."
  DEN-04:
    pregunta: en-vivo
    que_midio: "Si seguir a cada persona sigue sumando cuando el sistema procesa uno de cada quince cuadros."
  DEN-05:
    pregunta: en-vivo
    que_midio: "Cuánto del resultado por escena sobrevive si el sistema procesa uno de cada veintiséis cuadros."
  DEN-06:
    pregunta: en-vivo
    que_midio: "Si seguir a cada persona sigue sumando cuando el sistema procesa uno de cada veintiséis cuadros."
  DEN-07:
    pregunta: en-vivo
    que_midio: "Si la ganancia por seguir a cada persona (por sujeto contra por escena, a la misma densidad) y la pérdida por densidad excluyen el cero, con remuestreo pareado por clip."
    cifras:
      "R1−T1": "ΔF1 por escena: uno de cada 7 cuadros menos todos los cuadros"
      "R3−T1": "ΔF1 por escena: uno de cada 15 cuadros menos todos los cuadros"
      "R5−T1": "ΔF1 por escena: uno de cada 26 cuadros menos todos los cuadros"
      "R2−G1": "ΔF1 por sujeto: uno de cada 7 cuadros menos todos los cuadros"
      "R4−G1": "ΔF1 por sujeto: uno de cada 15 cuadros menos todos los cuadros"
      "R6−G1": "ΔF1 por sujeto: uno de cada 26 cuadros menos todos los cuadros"
      "R2−T1": "ΔF1: uno de cada 7 cuadros por sujeto menos todos los cuadros por escena"
      "G1−T1": "Ganancia por seguir a cada persona, con todos los cuadros"
      "R2−R1": "Ganancia por seguir a cada persona, uno de cada 7 cuadros"
      "R4−R3": "Ganancia por seguir a cada persona, uno de cada 15 cuadros"
      "R6−R5": "Ganancia por seguir a cada persona, uno de cada 26 cuadros"
  DIST-01:
    pregunta: que-se-construyo
    que_midio: "Cuánto tarda la distribución desde la alerta hasta la confirmación del broker MQTT, en las alertas de las pruebas de alerta y de densidad del perfil operativo."
  ERR-01:
    pregunta: obra-real
    que_midio: "Por qué se equivoca el sistema en obra real: cada falsa alarma por sujeto, asignada a una causa."
    cifras:
      "principal.falsas_alarmas": "Falsas alarmas por sujeto en los clips negativos (sin infracción)"
      "principal.P-no-detectado": "Por EPP no detectado"
      "principal.P-intermitente": "Por EPP visto de a ratos"
      "principal.F-sin-persona": "Sin persona en la referencia"
      "principal.U": "Por un atributo que no se puede ver"
      "principal.F-parcial": "Por una persona parcial"
      "principal.P-disputado": "Por EPP disputado entre personas"
      "principal.P-fuera-region": "Por EPP fuera de la región de evaluación"
      "principal.V": "Por una falta real, breve o fuera de episodio"
      "principal.alertas_extra_por_fragmentacion": "De ellas, alertas de más por fragmentación de identidad"
  ERR-02:
    pregunta: obra-real
    que_midio: "Si subir la resolución de entrada, con el mismo umbral de caja, cambia las causas de las falsas alarmas en obra real."
    cifras:
      "r560.falsas_alarmas": "Falsas alarmas por sujeto en los clips negativos (sin infracción), a 560 px con caja 0,35"
      "r560.P-no-detectado": "Por EPP no detectado, a 560 px con caja 0,35"
