# Las diez figuras del informe (plan de la consola de evidencia, §8.2): una lista cerrada.
#
# Criterio de entrada: una imagen entra solo si muestra algo que una tabla no puede mostrar. Este archivo
# declara las diez —qué es cada una, de qué pantalla o archivo sale, su pie y su sección— y es lo único que
# leen la herramienta que las genera (webconsole/tools/sacar_figuras.mjs) y el bloque «Cómo se ve» de cada
# pregunta. Se sacan en el tema claro.
#
# Dos carpetas (§8.1):
#   - pública: results/gen2/<prueba>/capturas/ — solo texto y gráficos, va al repositorio público. La única
#     figura pública sin prueba de la campaña, la de las curvas del ajuste fino, va a finetuning/curvas/, con sus
#     datos;
#   - privada: defensa/capturas/figuras/ — personas, cuadros de terceros o de clips de internet; no va a git.
#     La consola también la lee. `solo_informe: true` marca lo que tampoco viaja al Drive (clips de internet).
#
# Una fuente es una de estas:
#   {pantalla: <ruta de la consola>, selector: <css>}   se captura ese elemento de esa pantalla
#   {archivo: defensa/figuras/<prueba>/…}               se copia ese archivo (solo a la carpeta privada). Los de
#                                                        VIS-01 los graba esa prueba; los de RT-09 y EXT-01,
#                                                        webconsole/tools/armar_figuras_privadas.py
#   {archivo: ..., recorte_arriba: <px>}                 se copia sin esa franja de arriba: la banda con los
#                                                        códigos internos que graba la herramienta de VIS-01
#   {grafico: barras | lineas, datos: [...]}             un gráfico que la consola dibuja con cifras resueltas
#   {grafico: curvas, columna: ..., series: [{csv}]}     curvas por época leídas de CSV versionados en
#                                                        finetuning/curvas/
# Una figura que todavía no tiene fuente lleva `pendiente:` con el motivo, y no se genera.
#
# Ninguna cifra se escribe a mano: los gráficos usan las mismas referencias que preguntas.yaml, y las curvas,
# archivos de datos versionados.

schema: consola.figuras.v1

figuras:
  - id: plataforma
    numero: 1
    titulo: La plataforma desplegada
    preguntas: [que-se-construyo]
    seccion: "§17.6"
    prueba: PLAT-01
    pie: >-
      Los servicios de la plataforma corriendo en contenedores en el equipo de la campaña: el núcleo y las
      instancias de detección, con la activa destacada.
    privada: false
    # Se saca de la consola en contenedor con la plataforma desplegada: en una consola nativa la pantalla dice que
    # la orquestación necesita los contenedores.
    fuente: {pantalla: /platform, selector: "[data-figura='plataforma-servicios']"}

  # Reemplaza a la figura de la toma en vivo del capítulo 4 del informe.
  - id: toma-con-alerta
    numero: 2
    titulo: Una toma en vivo con su alerta confirmada
    preguntas: [que-se-construyo, en-vivo]
    seccion: "§17.5.5"
    prueba: RT-04
    pie: >-
      El cuadro en que el sistema confirmó la alerta de sin casco en una toma de la obra simulada, con el estado
      de cada condición en ese instante.
    privada: true
    fuente: {pantalla: /demo/resultado/demo_20261107T161545Z_P1, selector: "[data-figura='momento-toma']"}

  - id: mensaje-del-broker
    numero: 3
    titulo: El mensaje que recibió el broker
    preguntas: [que-se-construyo]
    seccion: "§17.3"
    prueba: RT-04
    pie: >-
      El mensaje de esa misma alerta tal como lo recibió el broker MQTT, y la línea de tiempo que va de la
      primera evidencia a la confirmación y a la entrega.
    privada: false
    fuente: {pantalla: /demo/resultado/demo_20261107T161545Z_P1, selector: "[data-figura='momento-mensaje']"}

  - id: acierto-del-rodaje
    numero: 4
    titulo: Un acierto del rodaje
    preguntas: [que-agrega]
    seccion: "§17.5.4"
    prueba: VIS-01
    pie: >-
      Un cuadro del rodaje con una alerta acertada: las cajas predichas con su puntaje, la identidad de cada
      persona y la región que evalúa la regla.
    privada: true
    fuente: {archivo: defensa/figuras/VIS-01/completas/exito_012_a_p1_c02_229.png, recorte_arriba: 44}

  - id: chaleco-falso
    numero: 5
    titulo: El chaleco falso
    preguntas: [en-vivo]
    seccion: "§17.5.5"
    prueba: RT-09
    pie: >-
      La misma escena y el mismo instante, después de sacarse el chaleco: con remera negra el detector sigue
      viendo un chaleco en el torso y la alerta no llega; con remera blanca, la alerta está confirmada.
    privada: true
    # La arma webconsole/tools/armar_figuras_privadas.py desde las imágenes anotadas de las dos tomas P2 del
    # perfil operativo y los eventos del motor de reglas; cómo elige el instante, en esa herramienta y en el
    # .json que deja al lado.
    fuente: {archivo: defensa/figuras/RT-09/chaleco-falso.png}

  - id: falsa-alarma-obra-real
    numero: 6
    titulo: Una falsa alarma en obra real
    preguntas: [obra-real]
    seccion: "§18.3"
    prueba: VIS-01
    pie: >-
      Una falsa alarma por sujeto en un clip de obra real sin infracción, con la caja que la disparó. Cuadro de
      un video de internet; su fuente está en el Anexo F del informe.
    privada: true
    solo_informe: true
    fuente: {archivo: defensa/figuras/VIS-01/completas/obra_real_026_v06_c01_1280.png, recorte_arriba: 44}

  - id: falsas-alarmas-por-causa
    numero: 7
    titulo: Las falsas alarmas por sujeto en obra real, por causa
    preguntas: [obra-real]
    seccion: "§17.5.4"
    prueba: ERR-01
    pie: >-
      Cada falsa alarma por sujeto en los clips de obra real sin infracción, asignada a una causa. Aparte, las
      que agrega la fragmentación de identidad.
    privada: false
    fuente:
      grafico: barras
      unidad: falsas alarmas
      datos:
        - {etiqueta: EPP no detectado, prueba: ERR-01, clave: principal.P-no-detectado}
        - {etiqueta: EPP visto de a ratos, prueba: ERR-01, clave: principal.P-intermitente}
        - {etiqueta: Sin persona en la referencia, prueba: ERR-01, clave: principal.F-sin-persona}
        - {etiqueta: Atributo que no se puede ver, prueba: ERR-01, clave: principal.U}
        - {etiqueta: Persona parcial, prueba: ERR-01, clave: principal.F-parcial}
        - {etiqueta: EPP disputado entre personas, prueba: ERR-01, clave: principal.P-disputado}
        - {etiqueta: Error de la referencia, prueba: ERR-01, clave: principal.V}
        - {etiqueta: EPP fuera de la región evaluada, prueba: ERR-01, clave: principal.P-fuera-region}
        - {etiqueta: De más por fragmentación de identidad, prueba: ERR-01, clave: principal.alertas_extra_por_fragmentacion, aparte: true}

  - id: f1-segun-cuadros-por-segundo
    numero: 8
    titulo: El F1 según los cuadros por segundo
    preguntas: [en-vivo]
    seccion: "§17.5.5"
    prueba: DEN-07
    pie: >-
      El F1 por episodio del rodaje a cuatro densidades de evidencia, mirando la escena y siguiendo a cada
      persona, con las mismas detecciones.
    privada: false
    fuente:
      grafico: lineas
      series: [Por escena, Por sujeto]
      # Las cadencias de las etiquetas no son resultados: son el diseño de cada prueba (el paso entre cuadros
      # del pre-registro sobre clips de 30 fps) y se escriben como en los nombres de fila de la Tabla 54
      # (informe-tablas.yaml). Sin ellas, el eje de una figura «según los cuadros por segundo» no los dice.
      datos:
        - etiqueta: Banco (30 fps)
          valores:
            - {prueba: ALR-01, clave: f1, decimales: 2}
            - {prueba: ALR-02, clave: f1, decimales: 2}
        - etiqueta: Techo en vivo (≈4,29 fps)
          valores:
            - {prueba: DEN-01, clave: f1, decimales: 2}
            - {prueba: DEN-02, clave: f1, decimales: 2}
        - etiqueta: Intermedia (2,00 fps)
          valores:
            - {prueba: DEN-03, clave: f1, decimales: 2}
            - {prueba: DEN-04, clave: f1, decimales: 2}
        - etiqueta: Peor caso (≈1,15 fps)
          valores:
            - {prueba: DEN-05, clave: f1, decimales: 2}
            - {prueba: DEN-06, clave: f1, decimales: 2}

  - id: curvas-del-ajuste-fino
    numero: 9
    titulo: Las curvas del ajuste fino
    preguntas: [que-detecta]
    seccion: "§17.5.6"
    prueba: null
    pie: >-
      El mAP50 de validación de los dos tramos del ajuste fino, época por época: la proyección de clases sube
      sin sobreajuste; el ajuste completo tiene su mejor época en la primera y después cae.
    privada: false
    # Sin prueba de la campaña (la Tabla 55 no se regeneró): los datos son los results.csv de Mendieta,
    # copiados byte a byte a finetuning/curvas/ (ver su README), y la figura se guarda al lado.
    fuente:
      grafico: curvas
      columna: metrics/mAP50(B)
      eje: mAP50 de validación
      eje_x: época
      decimales: 3
      series:
        - {nombre: Tramo 1 · proyección de clases, csv: finetuning/curvas/t1_full-1167640.results.csv}
        - {nombre: Tramo 2 · ajuste completo, csv: finetuning/curvas/t2_full-1167982.results.csv}

  - id: clase-nueva
    numero: 10
    titulo: Una clase nueva detectada sin entrenar
    preguntas: [que-detecta]
    seccion: "§17.5.2"
    prueba: EXT-01
    pie: >-
      Maquinaria detectada en una imagen de obra con una clase que nunca se configuró ni se entrenó. Imagen de
      construction_site_safety (CC BY 4.0).
    # La licencia permitiría publicarla, pero se arma con la imagen cruda del banco, que no está en git: la arma
    # webconsole/tools/armar_figuras_privadas.py con las cajas de machinery de la corrida de obra de EXT-01, y va
    # a la carpeta privada como las demás que se copian de un archivo.
    privada: true
    fuente: {archivo: defensa/figuras/EXT-01/clase-nueva.png}
