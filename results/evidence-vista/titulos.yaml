  - result_id: clip_bench/h1_gdinotiny560_hybor_scene
    etiqueta: "h1 gdinotiny560 hybor scene"
    # ✎ Corregido: decía «La histéresis, palanca de doble filo / Rescata
    # percepción intermitente y multiplica los falsos positivos». Los números
    # eran correctos y la ATRIBUCIÓN estaba invertida entera: el rescate de la
    # percepción intermitente es F-81.1 y es de T1 (CR-02 recall 1,000 con SDR
    # 0,281); la amplificación de falsos positivos es F-85.3 y es de D1. H1 es
    # la fusión E-HYB-or, y su resultado es el OPUESTO del que se le atribuía:
    # predicción pre-registrada REFUTADA, el recall se derrumba. Lo que H1 sí
    # midió es F-87.2 (clip_bench/index.md:29 y :166).
    titulo: La unión de evidencia (E-HYB-or)
    reclamo: >-
      Predicción pre-registrada refutada: el recall se derrumba de 0,824 a
      0,353. En una clasificación por frame un OR sólo puede agregar positivos;
      en un motor temporal no, porque se confirman episodios con ventana —
      sumar evidencia más temprana corre la alerta que ya había fuera de la
      suya.
