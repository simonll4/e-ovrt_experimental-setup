archived_only:
  - id: bench31_modelos_crudos
    plane: media-plane
    relation_result_id: bench_imagenes/modelos_crudos
    substitutes:
      - ../docs/operacion/datos/31-benchmark-modelos-host-local.datos.json
    reason: Los seis directorios originales ya no están en el workspace; el JSON crudo versionado conserva el summary y la evaluación completos de cada run.

  - id: t1_controls
    request_source: campaign:clip_bench/t1_gdinotiny560_v2short_scene
    substitute_from: matching_eval
    reason: Los 34 control runs T1 vivían en un scratchpad ausente; cada eval versionado conserva su resultado derivado y el ID original.

  - id: doc37_media
    plane: media-plane
    run_id: run_20260710_062654_dbe_mock_757a73
    substitutes:
      - ../docs/operacion/datos/37-2026-07-10-live-e2e-media-summary.json
    reason: El run original ya no está; se conserva el summary operativo versionado.

  - id: doc37_live_control
    plane: control-plane
    run_id: e2e_live_control
    substitutes:
      - ../docs/operacion/datos/37-2026-07-10-live-e2e-control-summary.json
      - ../docs/operacion/datos/37-2026-07-10-live-e2e-control-alerts.jsonl
    reason: El control run original ya no está; se conservan summary y alertas operativas.

  - id: doc37_replay_control
    plane: control-plane
    run_id: e2e_replay_control
    substitutes:
      - ../docs/operacion/datos/37-2026-07-10-live-e2e-replay-summary.json
    reason: El replay original ya no está; se conserva el summary byte-comparado.

  - id: doc39_media
    plane: media-plane
    run_id: run_20260710_144331_dbe_mock_47e4b2
    substitutes:
      - ../docs/operacion/datos/39-2026-07-10-g2a-video-summary.json
    reason: El run original ya no está; se conserva el summary de instrumentación G2A.

source_dispositions:
  - id: doc38_servicio_control
    disposition: methodology_only
    source: ../docs/operacion/38-servicio-control-plane.md
    reason: Describe el servicio; no agrega una medición ni un run citado adicional.
  - id: doc63_auditoria_bench
    disposition: duplicate_crosscheck
    source: ../docs/operacion/63-auditoria-bench-v2-s0.md
    reason: Audita los mismos runs de benchmark ya resueltos por las fuentes 31 y S1.
  - id: doc64_seleccion
    disposition: duplicate_crosscheck
    source: ../docs/operacion/64-resultados-s1-s2-seleccion-modelos.md
    reason: Sus runs se resuelven desde s1_matrix y b5_rescore.
  - id: doc66_ampliacion
    disposition: methodology_only
    source: ../docs/operacion/66-plan-ampliacion-bench-imagenes.md
    reason: Define la ampliación; los runs vigentes aparecen en B5, Nivel A y clase nueva.
  - id: doc68_manual_arranque
    disposition: methodology_only
    source: ../docs/operacion/68-manual-arranque-rodaje.md
    reason: Es una guía operativa y no una fuente de resultados.
  - id: doc74_higiene
    disposition: methodology_only
    source: ../docs/operacion/74-protocolo-higiene-medicion-realtime.md
    reason: Es el protocolo de medición; F-RT5 se declara por sus 23 bloques exactos.
  - id: doc96_densidad
    disposition: duplicate_crosscheck
    source: ../docs/operacion/96-costo-tiempo-real.md
    reason: R1-R6 se resuelven como campañas con provenance y controles propios.
  - id: doc101_derivados
    disposition: duplicate_crosscheck
    source: ../docs/operacion/datos/101-decimado-empirico-contraste.json
    reason: Los derivados usan media runs T1 ya declarados y 544 control runs resueltos desde evals.
  - id: doc73_exclusiones
    disposition: excluded
    source: ../docs/operacion/73-diagnostico-fps-realtime-contencion-gil.md
    runs:
      - run_20260727_222424_dbe_grounding_dino_599d5b
      - run_20260727_225143_dbe_grounding_dino_258401
    reason: El primero es telemetría previa y el segundo un bloque parcial de 25 s; ninguno integra los 23 bloques y 11 pares F-RT5 citados.

archive_policy:
  allowed_extensions:
    - .json
    - .jsonl
    - .csv
    - .yaml
    - .yml
    - .txt
    - .log
    - .md
  excluded_extensions:
    - .jpg
    - .jpeg
    - .png
    - .webp
    - .bmp
    - .gif
    - .tif
    - .tiff
    - .mp4
    - .avi
    - .mkv
    - .mov
    - .webm
    - .m4v
  excluded_directories:
    - previews
    - frames
    - images
    - annotated
    - videos
    - cameras
    - camera_presets
  max_archive_mib: 95
