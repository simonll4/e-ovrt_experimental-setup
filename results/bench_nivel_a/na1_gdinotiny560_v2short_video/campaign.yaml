      personas ahora-unknown cuentan como FP (regla D-113.2, declarada en el índice).
      Evidencia: docs/operacion/datos/113-nivel-a-consolidado-post-revision.json.

hardware: 'sin GPU (reusa las detecciones de las campañas I1 y del piloto)'
