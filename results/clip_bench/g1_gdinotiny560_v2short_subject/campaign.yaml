description: >
  Granularidad por SUJETO (G1) contra la línea de base de escena (T1). Cierra la última
  palanca abierta del banco: el mecanismo (a) de F-81.2 (doc 81) — el único que ninguna
  palanca de percepción ni de formulación puede tocar.

  Bajo escena el motor acumula "alguien sin casco", pero el GT exige que UN SUJETO
  sostenga la violación 4 s (regla C1 de derive_clip_gt). En multitud los sujetos se
  relevan: la escena nunca deja de estar en evidencia aunque ninguna persona individual
  sostenga el umbral, y la alerta cae fuera de la ventana del episodio. Bajo `subject`
  la semántica del motor coincide con la del GT.

