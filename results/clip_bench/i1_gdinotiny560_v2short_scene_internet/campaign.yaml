gt_note: >
  GT humano (CVAT, anotador `simon`), derivado con derive_clip_gt.py y los mismos
  umbrales 4000/7000, **re-derivado tras las correcciones firmadas del 08-09**.
  **2 episodios evaluables, 0 censurados** (1 CR-01 en v04_c01, 1 CR-01 en v01_c02) y
