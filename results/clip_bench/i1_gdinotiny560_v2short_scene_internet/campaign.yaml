# --- HISTORIA DE ALCANCE (por qué las cifras cambiaron respecto de versiones citadas) ---
generations:
  - gen: 1
    date: '2026-08-06'
    clips: 3
    note: >
      Primera corrida (docs 102/103): v04_c01, v06_c01, v10_c01. `v06_c01` figuraba
      como POSITIVO (1 episodio CR-02) y el banco no tenía clip soak. Sus cifras se
      citan en los docs 103/104/107, que llevan banner de corrección.
  - gen: 2
    date: '2026-08-07'
    clips: 4
    note: >
      Reconstrucción completa (doc 109). Dos cambios de GT: (a) la revisión visual en
      CVAT determinó que el episodio CR-02 de `v06_c01` era ERROR DE ANOTACIÓN — el
      clip pasó a negativo y, con 6:09,6 continuos, se volvió el primer clip SOAK del
      banco (habilita FAR/hora); (b) se incorporó `v04_c02`. Inferencia FRESCA de los
      4 clips en una sola sesión: una procedencia, un hardware.

  - gen: 3
    date: '2026-08-09'
    clips: 13
    note: >
      CAMPAÑA VIGENTE. El lote de internet quedó CERRADO (13 de 14 con GT; `v08_c01`
      excluido con causa, doc 111): inferencia fresca de los 13 en UNA sesión, 72 min
      de GPU, manifest `299ccc19…`. Determinismo re-confirmado: los 4 clips de la gen. 2
      dieron detecciones idénticas. La gen. 2 queda en `metrics.gen2.json`.
      ⚠️ En esta generación se corrigió un BUG del agregador que afectaba `far_per_hour`
      (numerador de todos los negativos, denominador de solo los soak — doc 111 §6): las
      cifras de FAR de las gen. 1/2 que circularon (48,7 / 2.045,6) eran incorrectas.
      Resultado original de la gen. 3: recall 0,750 · precision 0,375 · F1 0,500 ·
      FAR/hora 29,2 — SUPERADO por la re-evaluación de abajo.
      ⚠️ RE-EVALUACIÓN 2026-08-09 (revisión ciega del GT, doc 113 §B): la revisión
      visual de los 5 episodios del estrato tiró 3 (v04_c02 CR-01+CR-02 y v01_c01
      CR-01: estados no observables sobre-declarados; correcciones firmadas en sus
      clip.yaml). MISMAS detecciones y alertas (gen. 3, determinismo verificado:
      11/11 clips sin cambio de GT dieron evals idénticos); solo se re-corrió
      evaluate-alerts contra el GT re-derivado y se re-agregó. Los 13 evals quedaron
      archivados en evals/ (cierra el hueco de reproducibilidad D-G del doc 113).
      RESULTADO VIGENTE: 2 episodios evaluables (0 censurados) · recall 0,500 ·
      precision 0,250 · F1 0,333 · 11 negativos / 26 FP · FAR/hora soak 29,2 (sin
      cambio: 3 FP en 0,1027 h) · informativo all-negatives 109,8.
      ⚠️ TRAMPA AL AUDITAR `metrics.gen2.json` (anotado 2026-08-09, doc 113 §D3): ese
      archivo conserva el valor incorrecto (48,705647) junto a `far_basis: "solo clips
      soak…"`, string que describe la fórmula CORREGIDA y NO la que produjo ese número
      (se computó con los FP de todos los negativos sobre las horas de solo el soak).
      El archivo se conserva sin editar a propósito: es el registro de lo que la gen. 2
      produjo. Ver registry `clip_bench.md` §L1.
      ⚠️ AL CITAR EL FAR: el dato es "3 FP en 6:09,6 del único clip soak"; 29,2 es la
      tasa horaria derivada sobre 0,1027 h, no una hora de operación observada.

