description: >
  Estrato B: los 13 clips del lote de internet con GT humano (obra real, NO guionada).
  Es T1 con la combinación intacta y el material cambiado — la única variable es el
  estrato. **Precisa L4** (D-113.1, no la levanta): n = **2 episodios evaluables**
  tras la revisión ciega del GT.

  NO es comparable clip a clip con T1: son 13 clips contra 34, y el material difiere en
  fuente, iluminación, densidad y escala del sujeto. Se reporta como fila aparte con su
  desglose (D-90.6), nunca fusionado al agregado del rodaje.

