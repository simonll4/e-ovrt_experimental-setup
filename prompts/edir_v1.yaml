prompt_set:
  id: edir_v1
  description: >
    Set del carril E-DIR (doc 12 §2.2 del repo docs): formulaciones directas de
    ausencia/estado desde la Tabla C.1 (doc 08 §5.1) + Tabla 45 de Etapa 3.
    Un prompt por eje del protocolo de sensibilidad (§17.1.5.4.2): negación
    sintáctica, especificidad, estado observable y template de presencia
    (diagnóstico). Cada formulación es un prompt_id propio: nada se reformula
    después de congelar — una frase mal elegida es un resultado, no un bug.
  language: en
  # CONGELADO 2026-07-29 — acta: docs/operacion/76 del repo docs (revisión del
  # usuario doc 07 D1.6 + revisión técnica contra la arquitectura de backends;
  # misma acta que eind_v1). Nada se reformula después de congelar.
  status: frozen
  frozen_sha256: a1278d0c34cd13beb759a1fe10b13c7096f147f7be23154f28a79454b5643703
  track: comparative
  derives_from: null
  changes: >
    Primera versión. Fuente literal: tabla de ejes del doc 12 §2.2 (CR-01
    ejemplos C.1; CR-02 análogos construidos por el mismo eje).
  classes:
    # --- CR-01 (sin casco) ---
    - id: cr01_neg
      role: condition_evidence
      strategy: syntactic_negation
      condition_id: CR-01
      phrasings: { default: ["person without hard hat"] }
    - id: cr01_spec
      role: condition_evidence
      strategy: specificity
      condition_id: CR-01
      phrasings: { default: ["construction worker without safety helmet"] }
    - id: cr01_obs
      role: condition_evidence
      strategy: observable_state
      condition_id: CR-01
      phrasings: { default: ["person with bare head on construction site"] }
    # Template de PRESENCIA (doc 12 §2.2 regla 2): eje de diagnóstico
    # sintáctico, NO candidato a evidencia de ausencia. Se activa explícito
    # vía active_ids en las corridas de sensibilidad.
    - id: cr01_template
      role: diagnostic_template
      strategy: presence_template
      condition_id: CR-01
      enabled_by_default: false
      phrasings: { default: ["a photo of a hard hat"] }
    # --- CR-02 (sin chaleco) ---
    - id: cr02_neg
      role: condition_evidence
      strategy: syntactic_negation
      condition_id: CR-02
      phrasings: { default: ["person without safety vest"] }
    - id: cr02_spec
      role: condition_evidence
      strategy: specificity
      condition_id: CR-02
      phrasings: { default: ["construction worker without reflective vest"] }
    - id: cr02_obs
      role: condition_evidence
      strategy: observable_state
      condition_id: CR-02
      phrasings: { default: ["person without bright colored safety clothing"] }
    - id: cr02_template
      role: diagnostic_template
      strategy: presence_template
      condition_id: CR-02
      enabled_by_default: false
      phrasings: { default: ["a photo of a safety vest"] }
