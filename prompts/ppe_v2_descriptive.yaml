prompt_set:
  id: ppe_v2_descriptive
  description: >
    Set descriptivo v2 (NO congelado) para A/B contra los sets congelados del BENCH.
    Fraseo por backend: GDINO recibe sinónimos descriptivos cortos (acotados para no
    diluir el caption); YOLOE recibe etiquetas nominales. Mismas clases canónicas que
    canonical_v2 (person/helmet/vest/bare_head). Ver spec 2026-06-25-prompt-layer-design §11.
  language: en
  status: exploratory
  track: core
  derives_from: cr01_cr02_bench_v2
  changes: >
    Fraseo descriptivo por backend para A/B contra el set congelado del BENCH
    (mismas 4 clases canónicas). Migrado a la taxonomía de ejes del informe
    (spec 2026-07-17 §1): strategy por rol de la clase.
  classes:
    - id: person
      role: entity
      strategy: canonical_positive
      phrasings:
        default: ["person"]
        gdino: ["person", "worker"]
        yoloe: ["person"]
    - id: helmet
      role: ppe
      condition_id: CR-01
      strategy: canonical_positive
      phrasings:
        default: ["helmet"]
        gdino: ["hard hat", "safety helmet"]
        yoloe: ["helmet"]
    - id: vest
      role: ppe
      condition_id: CR-02
      strategy: canonical_positive
      phrasings:
        default: ["vest"]
        gdino: ["reflective vest", "high-visibility vest"]
        yoloe: ["vest"]
    - id: bare_head
      role: visual_risk_indicator
      condition_id: CR-01
      strategy: observable_state
      phrasings:
        default: ["bare head"]
        gdino: ["bare head", "uncovered head"]
        yoloe: ["bare head"]
