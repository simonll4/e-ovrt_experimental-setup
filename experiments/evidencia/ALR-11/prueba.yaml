schema: prueba.gen2.v1
id: ALR-11
titulo: "Alerta por episodio con YOLOE-26s (rodaje), escena y sujeto"
informe: ["Tabla 53", "§17.5.4", "§17.5.5"]
fase: F3
familia: clips
# Enmienda del 2026-11-12 (doc 134 §13.23), escrita y commiteada ANTES de correr: después de F7.
pregunta: >
  En vivo, de cerca y con una persona (RT-05), YOLOE-26s fue el único motor que procesó los 15 cuadros
  por segundo de la cámara, y salió como el guion en 6 de 6 tomas. ¿Se sostiene sobre los 34 clips del
  rodaje, con personas más lejos y varias a la vez? Mismo banco, misma referencia corregida, mismo prompt
  set y misma regla que ALR-01 (el campeón) y ALR-03 (GDINO base): cambia solo el detector.
gen1:
  result_id: (no corrió)
  doc: operacion/145
  relacion: otra_combinacion
  motivo: >
    Combinación nueva (doc 145 §5, A4): YOLOE nunca corrió sobre el banco de clips. Se compara con ALR-01
    (el campeón: F1 0,841 por escena) y ALR-03 (GDINO base: 0,676), y por sujeto con ALR-02 (0,899).
esperado: >
  Pronóstico escrito antes de correr (no es evidencia): F1 por escena por debajo del campeón. En el banco
  de imágenes, YOLOE-26x detecta chalecos con AP 0,24 contra 0,55 del campeón (IMG-03; el 26s no está en
  ese banco), y en el rodaje en vivo de julio YOLOE-26s dio 0 de 3 alertas confiables (F-RT2: el EPP
  puesto aparece y desaparece). GDINO base también anduvo mejor en vivo y en este banco dio 0,676. Si
  YOLOE-26s queda cerca del campeón, es un candidato real para el vivo: con la cámara a 15 cuadros por
  segundo procesó los 15, donde GDINO procesó entre 5 y 6 (RT-05). No re-elige el modelo ni cambia la
  demo.
veredictos_posibles: [otra_combinacion]
config:
  modelo: yoloe/yoloe-26s (640 px, confianza 0,25, caja 0,35, IoU 0,50; la misma instancia de RT-05)
  prompt_set: cr01_cr02_v2_short
  pattern_set: cr01_cr02_v2 (escena) y cr01_cr02_v2_subject (variante sujeto, identidad de la plataforma)
  stride: 1
receta:
