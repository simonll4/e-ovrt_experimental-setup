  doc: operacion/134
  relacion: otra_combinacion
  motivo: >
    El piloto 134 corrió sobre las alertas de la generación 1; acá corre sobre las de la
    generación 2. Mismo arnés, misma semilla y mismo número de réplicas.
esperado: >
  Las 8 conclusiones de C1, C6, C7 y C8 con su fracción sostenida por J, al lado de la del piloto.
  Las de C2–C5 comparan contra pruebas de contraste que no se regeneran (ALR-03…06, doc 134
  §13.6): conservan la fracción del piloto, que se copia al resultado con su fuente. El arnés
  primero verifica (V1) que, sin perturbar, reproduce el metrics.json de cada prueba; si no, aborta.
