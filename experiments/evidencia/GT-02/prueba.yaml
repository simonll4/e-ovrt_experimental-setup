depende_de: [ALR-01, ALR-02, ALR-07, ALR-08, DEN-01, DEN-02, DEN-03, DEN-04, DEN-05, DEN-06]
pregunta: >
  Si los bordes del GT estuvieran corridos hasta ±0,5 / ±1 / ±2 s, ¿en qué fracción de las
  referencias simuladas se sostiene cada conclusión comparativa del informe?
gen1:
