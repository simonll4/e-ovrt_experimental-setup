run:
  id: null
  scenario: EBE
  name: control_talert_camera_smoke
  description: Smoke suplementario de cámara para t_alert-notification.
input:
  type: bus
  track_persons: true
  bus:
    endpoint: tcp://127.0.0.1:5557
    topics:
      - media.detection.v1.
      - run.lifecycle.v1.
    hwm: 1000
    recv_timeout_ms: 1000
    idle_timeout_s: 300
    finish:
      signal: run_lifecycle
      poll_url: null
      poll_interval_s: 5
patterns:
  file: ${EOVRT_WORKSPACE}/e-ovrt_control-plane/configs/patterns/cr01_cr02_v2_subject.yaml
  active_ids: [CR-01, CR-02]
outputs:
  base_dir: ${EOVRT_WORKSPACE}/e-ovrt_control-plane/runs
  save_pattern_events_jsonl: true
  save_alerts_jsonl: true
  save_metrics_jsonl: true
  save_errors_jsonl: true
  save_summary_json: true
logging:
  level: INFO
alert_bus:
  enabled: true
  endpoint: tcp://0.0.0.0:5558
  hwm: 1000
  wait_for_subscriber_ms: 10000
