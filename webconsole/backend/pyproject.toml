[project]
name = "eovrt-webconsole"
version = "0.1.0"
description = "Web console BFF para el servicio media-plane (Spec B, MVP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]",
    "httpx",
    "pyyaml",
    "websockets>=12",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["httpx2", "pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:remove second argument of ws_handler:DeprecationWarning:websockets.legacy.server",
]
